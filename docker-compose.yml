services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_STOCK_API_KEY: ${VITE_STOCK_API_KEY:-demo}
    container_name: stock-price-tracker
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    environment:
      - NODE_ENV=production
